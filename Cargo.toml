[package]
name = "kukufm-dl"
version = "0.1.0"
edition = "2021"
description = "A lightning-fast Rust tool to download premium Kukufm content"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
m3u8-rs = "6.0"
lofty = "0.21"
futures = "0.3"
anyhow = "1.0"
indicatif = "0.17"
console = "0.15"
